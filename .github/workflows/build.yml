name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe needs tags and history; the default shallow clone has
          # neither, so the version string would be empty even once git works.
          fetch-depth: 0

      # The checkout action registers safe.directory under a temporary HOME, so
      # it is gone by the time the container's build steps run as root: the
      # Makefiles' `git describe` then dies with "dubious ownership" and the
      # version compiled in becomes a bare "-dirty".
      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      # Binaries built here and locally have differed in ways only the
      # toolchain can explain, and the image is a moving target ("latest").
      # Record what actually built the artifact so the two can be compared.
      # Informational only: never let it fail the build (the compiler is not on
      # PATH in a plain run step - the Makefiles reach it through $DEVKITPRO).
      - name: Toolchain versions
        continue-on-error: true
        run: |
          (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) \
            | grep -Ei 'devkita64|libnx|newlib|binutils' || true
          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1 || true
          git --version || true
          echo "version string this build will stamp:"
          echo "  $(git describe --tags 2>/dev/null)$(git diff --quiet --ignore-submodules=all HEAD 2>/dev/null || echo -dirty)"
          exit 0

      - name: Apply Atmosphere-libs patches
        run: git -C Atmosphere-libs apply ../docs/atmosphere-libs-mitm-domain-id-collision.patch

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build
        id: build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"
        continue-on-error: true

      - name: Install libnx master & Retry build
        id: retry
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd
          make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload built files
        uses: actions/upload-artifact@v5
        with:
          name: sdcard
          path: out/sd
          # The overlay lives in switch/.overlays, and a dot-prefixed directory
          # is excluded by default - the artifact silently shipped the
          # sysmodule with no overlay, so installing "everything" from a build
          # run left whatever overlay was already on the card.
          include-hidden-files: true

      - name: Upload elf file
        uses: actions/upload-artifact@v5
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload elf file
        uses: actions/upload-artifact@v5
        with:
          name: overlay.elf
          path: overlay/overlay.elf
